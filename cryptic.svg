    GOKUL N.R.
  </text>

  <text
    x="573"
    y="27"
    text-anchor="end"
    class="tiny"
    fill="#656a71">
    DEVELOPMENT // 01
  </text>


  <!-- ======================================================= -->
  <!-- TOP RED ACCENT -->
  <!-- ======================================================= -->

  <path
    d="M27 34 H155"
    stroke="#ff1638"
    stroke-width="2"/>

  <path
    d="M445 34 H573"
    stroke="#ff1638"
    stroke-width="2"/>

  <circle
    cx="161"
    cy="34"
    r="2"
