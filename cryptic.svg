        }

        94% {
          transform: translateY(-448px);
        }

        98% {
          transform: translateY(-64px);
        }

        100% {
          transform: translateY(0);
        }
      }


      @keyframes roll-slot-5 {

        0% {
          transform: translateY(0);
        }

        2% {
          transform: translateY(-192px);
        }

        6% {
          transform: translateY(-64px);
        }

        10% {
          transform: translateY(-448px);
        }

        14% {
          transform: translateY(-256px);
        }

        18% {
