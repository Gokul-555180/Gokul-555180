<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 180"
     width="600"
     height="180">

  <defs>

    <!-- ===================================================== -->
    <!-- TYPOGRAPHY -->
    <!-- ===================================================== -->

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&amp;family=Share+Tech+Mono&amp;display=swap');

      .title {
        font-family: 'Rajdhani', 'Arial Narrow', Arial, sans-serif;
        font-weight: 700;
        letter-spacing: 5px;
      }

      .mono {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
      }

      .tiny {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 7px;
        letter-spacing: 1.4px;
      }

      .small {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 8px;
        letter-spacing: 1px;
      }
    </style>


    <!-- ===================================================== -->
    <!-- CARBON GRID -->
    <!-- ===================================================== -->

    <pattern
      id="carbon"
      width="8"
      height="8"
      patternUnits="userSpaceOnUse">

      <path
        d="M0 0H4V4H0Z M4 4H8V8H4Z"
        fill="#111317"/>

      <path
        d="M4 0H8V4H4Z M0 4H4V8H0Z"
        fill="#0c0e11"/>

    </pattern>


    <!-- ===================================================== -->
    <!-- MICRO GRID -->
    <!-- ===================================================== -->

    <pattern
      id="grid"
      width="20"
      height="20"
      patternUnits="userSpaceOnUse">

      <path
        d="M20 0H0V20"
        fill="none"
        stroke="#24282d"
        stroke-width="0.55"/>

    </pattern>


    <!-- ===================================================== -->
    <!-- GLOW -->
    <!-- ===================================================== -->

    <filter
      id="redGlow"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%">

      <feGaussianBlur
        stdDeviation="2.5"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>


    <filter
      id="whiteGlow"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%">

      <feGaussianBlur
        stdDeviation="1.5"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>


    <!-- ===================================================== -->
    <!-- TITLE CLIP -->
    <!-- ===================================================== -->

    <clipPath id="titleClip">
      <rect
        x="115"
        y="39"
        width="370"
        height="55"/>
    </clipPath>


    <!-- ===================================================== -->
    <!-- STEERING WHEEL CLIP -->
    <!-- ===================================================== -->

    <clipPath id="wheelClip">
      <rect
        x="120"
        y="98"
        width="360"
        height="72"/>
    </clipPath>

  </defs>


  <!-- ======================================================= -->
  <!-- BACKGROUND -->
  <!-- ======================================================= -->

  <rect
    width="600"
    height="180"
    rx="10"
    fill="#08090b"/>

  <rect
    width="600"
    height="180"
    rx="10"
    fill="url(#carbon)"/>

  <rect
    width="600"
    height="180"
    rx="10"
    fill="url(#grid)"
    opacity="0.35"/>


  <!-- ======================================================= -->
  <!-- TOP INFORMATION -->
  <!-- ======================================================= -->

  <text
    x="27"
    y="27"
    class="tiny"
