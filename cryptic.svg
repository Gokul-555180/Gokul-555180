      /* ===================================================== */
      /*                     CURSOR                            */
      /* ===================================================== */

      @keyframes blink {

        0%, 49% {
          opacity: 1;
        }

        50%, 99% {
          opacity: 0;
        }

      }

      .cursor {
        animation: blink 0.8s infinite;
        fill: #38bdf8;
        filter:
          drop-shadow(0 0 4px rgba(56, 189, 248, 0.75));
      }


      /* ===================================================== */
      /*                  SUBTITLE STATES                      */
