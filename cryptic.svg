        94% {
          transform: translateY(-320px);
        }

        98% {
          transform: translateY(-128px);
        }

        100% {
          transform: translateY(0);
        }
      }


      .slot-1 {
        animation:
          roll-slot-1
          7s
          infinite
          cubic-bezier(0.25, 1, 0.5, 1);
      }

      .slot-2 {
        animation:
          roll-slot-2
          7s
          infinite
          cubic-bezier(0.25, 1, 0.5, 1);
      }

      .slot-3 {
        animation:
          roll-slot-3
          7s
          infinite
          cubic-bezier(0.25, 1, 0.5, 1);
      }

      .slot-4 {
        animation:
          roll-slot-4
          7s
          infinite
