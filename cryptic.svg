    <!-- BACKGROUND PATTERNS -->
    <!-- ===================================================== -->

    <pattern id="grid"
             width="24"
             height="24"
             patternUnits="userSpaceOnUse">

      <path d="M24 0H0V24"
            fill="none"
            stroke="#10383e"
            stroke-width="0.7"
            opacity="0.42"/>

    </pattern>

    <pattern id="microGrid"
             width="6"
             height="6"
             patternUnits="userSpaceOnUse">

      <path d="M6 0H0V6"
            fill="none"
            stroke="#0b2429"
            stroke-width="0.35"
            opacity="0.45"/>

    </pattern>

  </defs>


