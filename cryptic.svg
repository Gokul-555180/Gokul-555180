      @keyframes sub-loading {

        0%, 25% {
          opacity: 1;
        }

        26%, 100% {
          opacity: 0;
        }

      }


      @keyframes sub-ready {

        0%, 25% {
          opacity: 0;
        }

        26%, 90% {
          opacity: 1;
        }

        91%, 100% {
          opacity: 0;
        }

      }


      .sub-loading {
        fill: #64748b;

        text-shadow:
          0 0 5px rgba(100, 116, 139, 0.5);

        animation:
          sub-loading
          7s
          infinite;
      }


      .sub-ready {
        fill: #38bdf8;

        text-shadow:
          0 0 5px rgba(56, 189, 248, 0.65);

        animation:
          sub-ready
          7s
          infinite;
      }


      /* ===================================================== */
      /*                    SCANLINES                          */
      /* ===================================================== */

      .scanlines {
        fill: url(#scanline-pattern);
        opacity: 0.07;
        pointer-events: none;
