```svg
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 900 240"
     width="900"
     height="240">

  <defs>

    <!-- ===================================================== -->
    <!--                    TYPOGRAPHY                         -->
    <!-- ===================================================== -->

    <style>

      .terminal-text {
        font-family: 'Share Tech Mono', 'Courier New', Courier, monospace;
        font-weight: bold;
        font-size: 64px;
        fill: #38bdf8;
        text-shadow:
          0 0 8px rgba(56, 189, 248, 0.75),
          0 0 20px rgba(56, 189, 248, 0.45),
          0 0 40px rgba(56, 189, 248, 0.18);
      }

      .matrix-col {
        font-family: 'Share Tech Mono', 'Courier New', Courier, monospace;
        font-size: 12px;
        fill: #22d3ee;
        user-select: none;
      }

      .sub-text {
        font-family: 'Share Tech Mono', 'Courier New', Courier, monospace;
        font-size: 15px;
        letter-spacing: 3px;
        font-weight: bold;
      }


      /* ===================================================== */
      /*                  MATRIX ANIMATION                     */
      /* ===================================================== */

      @keyframes matrix-fall-1 {
        0% {
          transform: translateY(-150px);
          opacity: 0;
        }

        10% {
          opacity: 0.18;
        }

        90% {
          opacity: 0.18;
        }

        100% {
          transform: translateY(240px);
          opacity: 0;
        }
      }

      @keyframes matrix-fall-2 {
        0% {
          transform: translateY(-150px);
          opacity: 0;
        }

        10% {
          opacity: 0.12;
        }

        90% {
          opacity: 0.12;
        }

        100% {
          transform: translateY(240px);
          opacity: 0;
        }
      }

      .m-col-1 {
        animation: matrix-fall-1 4.8s infinite linear;
      }

      .m-col-2 {
        animation: matrix-fall-2 3.9s infinite linear;
      }

      .m-col-3 {
        animation: matrix-fall-1 5.4s infinite linear;
      }

      .m-col-4 {
        animation: matrix-fall-2 4.2s infinite linear;
      }

      .m-col-5 {
        animation: matrix-fall-1 4.4s infinite linear;
      }

      .m-col-6 {
        animation: matrix-fall-2 5.1s infinite linear;
      }


      /* ===================================================== */
      /*                CHARACTER SCRAMBLING                  */
      /* ===================================================== */

      @keyframes roll-slot-1 {

        0% {
          transform: translateY(0);
        }

        2% {
          transform: translateY(-128px);
        }

        5% {
          transform: translateY(-320px);
        }

        8% {
          transform: translateY(-192px);
        }

        11% {
          transform: translateY(-512px);
        }

        14% {
          transform: translateY(-640px);
        }

        17% {
          transform: translateY(-768px);
        }

        90% {
          transform: translateY(-768px);
        }

        93% {
          transform: translateY(-384px);
        }

        96% {
          transform: translateY(-128px);
        }

        100% {
          transform: translateY(0);
        }
      }


      @keyframes roll-slot-2 {

        0% {
          transform: translateY(0);
        }

        3% {
          transform: translateY(-192px);
        }

        6% {
          transform: translateY(-64px);
        }

