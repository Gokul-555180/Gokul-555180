      GOKUL
    </text>


    <!-- primary -->
    <text
      x="300"
      y="88"
      text-anchor="middle"
      class="title"
      font-size="53"
      fill="#f2f3f4"
      filter="url(#whiteGlow)">
      GOKUL

      <animate
        attributeName="opacity"
        values="1;1;0.82;1;1"
        keyTimes="0;0.92;0.935;0.95;1"
        dur="4s"
        repeatCount="indefinite"/>
    </text>


    <!-- racing glitch line -->
    <rect
      x="125"
      y="66"
      width="350"
      height="1"
      fill="#ff1638"
      opacity="0">

