<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180">

  <defs>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');

      .terminal-text {
        font-family: 'Share Tech Mono', 'Courier New', Courier, monospace;
        font-weight: bold;
        font-size: 55px;
        fill: #00ffcc;
        text-shadow:
          0 0 8px rgba(0, 255, 204, 0.6),
          0 0 20px rgba(0, 255, 204, 0.3);
      }

      .matrix-col {
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        fill: #00ff66;
        user-select: none;
      }

      .sub-text {
        font-family: 'Share Tech Mono', 'Courier New', Courier, monospace;
        font-size: 13px;
        letter-spacing: 2px;
        font-weight: bold;
      }

      .sub-loading {
        fill: #ff3366;
        text-shadow: 0 0 5px rgba(255, 51, 102, 0.6);
      }

      .sub-ready {
        fill: #00ffcc;
        text-shadow: 0 0 5px rgba(0, 255, 204, 0.6);
      }

      .scanlines {
        fill: url(#scanline-pattern);
        opacity: 0.08;
        pointer-events: none;
      }
    </style>

    <pattern
      id="grid"
      width="20"
      height="20"
      patternUnits="userSpaceOnUse">
      <path
        d="M 20 0 L 0 0 0 20"
        fill="none"
        stroke="#161b22"
        stroke-width="1"/>
    </pattern>

    <pattern
      id="scanline-pattern"
      width="100"
      height="4"
      patternUnits="userSpaceOnUse">
      <line
        x1="0"
        y1="0"
        x2="100"
        y2="0"
        stroke="#000"
        stroke-width="2"/>
    </pattern>

    <clipPath id="text-clip">
      <rect
        x="0"
        y="38"
        width="600"
        height="64"/>
    </clipPath>

  </defs>


  <!-- ========================================================= -->
  <!-- Background -->
  <!-- ========================================================= -->

  <rect
    width="100%"
    height="100%"
    fill="#0a0b10"
    rx="10"/>

  <rect
    width="100%"
    height="100%"
    fill="url(#grid)"
    rx="10"/>


  <!-- ========================================================= -->
  <!-- Falling Matrix Code -->
  <!-- ========================================================= -->

  <g opacity="0.4">

    <!-- Column 1 -->
    <text
      x="40"
      y="0"
      class="matrix-col">

      <tspan x="40" dy="15">▩</tspan>
      <tspan x="40" dy="15">1</tspan>
      <tspan x="40" dy="15">0</tspan>
      <tspan x="40" dy="15">▚</tspan>
      <tspan x="40" dy="15">Ø</tspan>
      <tspan x="40" dy="15">Σ</tspan>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 -120; 0 180"
        dur="4.5s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values="0;0.2;0.2;0"
        keyTimes="0;0.1;0.9;1"
        dur="4.5s"
        repeatCount="indefinite"/>

    </text>


    <!-- Column 2 -->
    <text
      x="140"
      y="0"
      class="matrix-col">

      <tspan x="140" dy="15">█</tspan>
      <tspan x="140" dy="15">7</tspan>
      <tspan x="140" dy="15">▩</tspan>
      <tspan x="140" dy="15">æ</tspan>
      <tspan x="140" dy="15">1</tspan>
      <tspan x="140" dy="15">0</tspan>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 -120; 0 180"
        dur="3.8s"
        begin="1.5s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values="0;0.15;0.15;0"
        keyTimes="0;0.1;0.9;1"
        dur="3.8s"
        begin="1.5s"
        repeatCount="indefinite"/>

    </text>


    <!-- Column 3 -->
    <text
      x="460"
      y="0"
      class="matrix-col">

      <tspan x="460" dy="15">▞</tspan>
      <tspan x="460" dy="15">0</tspan>
      <tspan x="460" dy="15">μ</tspan>
      <tspan x="460" dy="15">1</tspan>
      <tspan x="460" dy="15">λ</tspan>
      <tspan x="460" dy="15">▩</tspan>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 -120; 0 180"
        dur="5.2s"
        begin="0.8s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values="0;0.2;0.2;0"
        keyTimes="0;0.1;0.9;1"
        dur="5.2s"
        begin="0.8s"
        repeatCount="indefinite"/>

    </text>


    <!-- Column 4 -->
    <text
      x="540"
      y="0"
      class="matrix-col">

      <tspan x="540" dy="15">1</tspan>
      <tspan x="540" dy="15">0</tspan>
      <tspan x="540" dy="15">π</tspan>
      <tspan x="540" dy="15">▚</tspan>
      <tspan x="540" dy="15">θ</tspan>
      <tspan x="540" dy="15">█</tspan>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 -120; 0 180"
        dur="4.1s"
        begin="2.2s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values="0;0.15;0.15;0"
        keyTimes="0;0.1;0.9;1"
        dur="4.1s"
        begin="2.2s"
        repeatCount="indefinite"/>

    </text>

  </g>


  <!-- ========================================================= -->
  <!-- Cyber Border -->
  <!-- ========================================================= -->

  <rect
    x="10"
    y="10"
    width="580"
    height="160"
    rx="8"
    fill="none"
    stroke="#1f2438"
    stroke-width="1.5"/>


  <!-- Neon corners -->

  <path
    d="M 10 35 L 10 10 L 35 10"
    fill="none"
    stroke="#00ffcc"
    stroke-width="2.5"
    stroke-linecap="round"/>

  <path
    d="M 590 35 L 590 10 L 565 10"
    fill="none"
    stroke="#00ffcc"
    stroke-width="2.5"
    stroke-linecap="round"/>

  <path
    d="M 10 145 L 10 170 L 35 170"
    fill="none"
    stroke="#00ffcc"
    stroke-width="2.5"
    stroke-linecap="round"/>

  <path
    d="M 590 145 L 590 170 L 565 170"
    fill="none"
    stroke="#00ffcc"
    stroke-width="2.5"
    stroke-linecap="round"/>


  <!-- ========================================================= -->
  <!-- GOKUL Terminal Text -->
  <!-- ========================================================= -->

  <g clip-path="url(#text-clip)">


    <!-- ======================================================= -->
    <!-- G -->
    <!-- ======================================================= -->

    <g>

      <text x="195" y="86" class="terminal-text">_</text>
      <text x="195" y="146" class="terminal-text">0</text>
      <text x="195" y="206" class="terminal-text">1</text>
      <text x="195" y="266" class="terminal-text">▚</text>
      <text x="195" y="326" class="terminal-text">¶</text>
      <text x="195" y="386" class="terminal-text">¥</text>
      <text x="195" y="446" class="terminal-text">Σ</text>
      <text x="195" y="506" class="terminal-text">Ω</text>
      <text x="195" y="566" class="terminal-text">β</text>
      <text x="195" y="626" class="terminal-text">æ</text>
      <text x="195" y="686" class="terminal-text">G</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="
          0 0;
          0 -120;
          0 -300;
          0 -180;
          0 -480;
          0 -540;
          0 -600;
          0 -600;
          0 -360;
          0 -120;
          0 0"
        keyTimes="
          0;
          0.02;
          0.05;
          0.08;
          0.11;
          0.14;
          0.17;
          0.90;
          0.93;
          0.96;
          1"
        dur="7s"
        repeatCount="indefinite"/>

    </g>


    <!-- ======================================================= -->
    <!-- O -->
    <!-- ======================================================= -->

    <g>

      <text x="245" y="86" class="terminal-text">_</text>
      <text x="245" y="146" class="terminal-text">1</text>
      <text x="245" y="206" class="terminal-text">0</text>
      <text x="245" y="266" class="terminal-text">▞</text>
      <text x="245" y="326" class="terminal-text">§</text>
      <text x="245" y="386" class="terminal-text">€</text>
      <text x="245" y="446" class="terminal-text">Δ</text>
      <text x="245" y="506" class="terminal-text">μ</text>
      <text x="245" y="566" class="terminal-text">λ</text>
      <text x="245" y="626" class="terminal-text">œ</text>
      <text x="245" y="686" class="terminal-text">O</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="
          0 0;
          0 -180;
          0 -60;
          0 -420;
          0 -240;
          0 -540;
          0 -600;
          0 -600;
          0 -240;
          0 -60;
          0 0"
        keyTimes="
          0;
          0.03;
          0.06;
          0.10;
          0.14;
          0.18;
          0.22;
          0.90;
          0.94;
          0.98;
          1"
        dur="7s"
        repeatCount="indefinite"/>

    </g>


    <!-- ======================================================= -->
    <!-- K -->
    <!-- ======================================================= -->

    <g>

      <text x="295" y="86" class="terminal-text">_</text>
      <text x="295" y="146" class="terminal-text">0</text>
      <text x="295" y="206" class="terminal-text">1</text>
      <text x="295" y="266" class="terminal-text">█</text>
      <text x="295" y="326" class="terminal-text">‡</text>
      <text x="295" y="386" class="terminal-text">£</text>
      <text x="295" y="446" class="terminal-text">Ξ</text>
      <text x="295" y="506" class="terminal-text">π</text>
      <text x="295" y="566" class="terminal-text">θ</text>
      <text x="295" y="626" class="terminal-text">ÿ</text>
      <text x="295" y="686" class="terminal-text">K</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="
          0 0;
          0 -240;
          0 -120;
          0 -480;
          0 -300;
          0 -540;
          0 -600;
          0 -600;
          0 -180;
          0 -120;
          0 0"
        keyTimes="
          0;
          0.04;
          0.08;
          0.13;
          0.18;
          0.22;
          0.26;
          0.90;
          0.95;
          0.98;
          1"
        dur="7s"
        repeatCount="indefinite"/>

    </g>


    <!-- ======================================================= -->
    <!-- U -->
    <!-- ======================================================= -->

    <g>

      <text x="345" y="86" class="terminal-text">_</text>
      <text x="345" y="146" class="terminal-text">1</text>
      <text x="345" y="206" class="terminal-text">0</text>
      <text x="345" y="266" class="terminal-text">▚</text>
      <text x="345" y="326" class="terminal-text">§</text>
      <text x="345" y="386" class="terminal-text">€</text>
      <text x="345" y="446" class="terminal-text">Δ</text>
      <text x="345" y="506" class="terminal-text">μ</text>
      <text x="345" y="566" class="terminal-text">λ</text>
      <text x="345" y="626" class="terminal-text">Ω</text>
      <text x="345" y="686" class="terminal-text">U</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="
          0 0;
          0 -180;
          0 -60;
          0 -420;
          0 -240;
          0 -540;
          0 -600;
          0 -600;
          0 -240;
          0 -60;
          0 0"
        keyTimes="
          0;
          0.03;
          0.06;
          0.10;
          0.14;
          0.18;
          0.22;
          0.90;
          0.94;
          0.98;
          1"
        dur="7s"
        repeatCount="indefinite"/>

    </g>


    <!-- ======================================================= -->
    <!-- L -->
    <!-- ======================================================= -->

    <g>

      <text x="395" y="86" class="terminal-text">_</text>
      <text x="395" y="146" class="terminal-text">0</text>
      <text x="395" y="206" class="terminal-text">1</text>
      <text x="395" y="266" class="terminal-text">▞</text>
      <text x="395" y="326" class="terminal-text">¶</text>
      <text x="395" y="386" class="terminal-text">¥</text>
      <text x="395" y="446" class="terminal-text">Σ</text>
      <text x="395" y="506" class="terminal-text">Ω</text>
      <text x="395" y="566" class="terminal-text">β</text>
      <text x="395" y="626" class="terminal-text">æ</text>
      <text x="395" y="686" class="terminal-text">L</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="
          0 0;
          0 -240;
          0 -120;
          0 -480;
          0 -300;
          0 -540;
          0 -600;
          0 -600;
          0 -180;
          0 -120;
          0 0"
        keyTimes="
          0;
          0.04;
          0.08;
          0.13;
          0.18;
          0.22;
          0.26;
          0.90;
          0.95;
          0.98;
          1"
        dur="7s"
        repeatCount="indefinite"/>

    </g>

  </g>


  <!-- ========================================================= -->
  <!-- Blinking Cursor -->
  <!-- ========================================================= -->

  <rect
    x="445"
    y="48"
    width="16"
    height="42"
    fill="#00ffcc"
    filter="drop-shadow(0 0 4px rgba(0,255,204,0.6))">

    <animate
      attributeName="opacity"
      values="1;1;0;0"
      keyTimes="0;0.49;0.50;0.99"
      dur="0.8s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ========================================================= -->
  <!-- Subtitle -->
  <!-- ========================================================= -->

  <text
    x="315"
    y="132"
    text-anchor="middle"
    class="sub-text sub-loading">

    [ INITIALIZING_PROFILE... ]

    <animate
      attributeName="opacity"
      values="1;1;0;0"
      keyTimes="0;0.25;0.26;1"
      dur="7s"
      repeatCount="indefinite"/>

  </text>


  <text
    x="315"
    y="132"
    text-anchor="middle"
    class="sub-text sub-ready">

    [ FULL-STACK DEVELOPMENT &amp; AI ]

    <animate
      attributeName="opacity"
      values="0;0;1;1;0"
      keyTimes="0;0.25;0.26;0.90;1"
      dur="7s"
      repeatCount="indefinite"/>

  </text>


  <!-- ========================================================= -->
  <!-- Decorative Horizontal Rule -->
  <!-- ========================================================= -->

  <line
    x1="150"
    y1="145"
    x2="450"
    y2="145"
    stroke="#1f2438"
    stroke-dasharray="5,5"
    stroke-width="1"/>


  <!-- ========================================================= -->
  <!-- Scanlines -->
  <!-- ========================================================= -->

  <rect
    width="100%"
    height="100%"
    class="scanlines"
    rx="10"/>

</svg>
